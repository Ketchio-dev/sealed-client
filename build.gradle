import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import org.gradle.plugins.signing.Sign

plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
    id "maven-publish"
    id "signing"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "sealedclient-e2e"
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = true
        username = "SEALED_E2E"
    }
}

version = project.mod_version
group = project.maven_group

def expandedModVersion = version
def noticeArchiveName = project.archives_base_name
def baritoneSmokeJar = providers.gradleProperty("baritoneSmokeJar")
def baritoneSmokeSupportJar = providers.gradleProperty("baritoneSmokeSupportJar")

base {
    archivesName = project.archives_base_name
}

repositories {
    // Official Baritone release assets are consumed at compile time only. The
    // API is never bundled into the Sealed Client JAR; users install Baritone separately.
    ivy {
        name = "OfficialBaritoneReleases"
        url = uri("https://github.com/cabaletta/baritone/releases/download")
        patternLayout {
            artifact("v[revision]/[artifact]-[revision].[ext]")
        }
        metadataSources {
            artifact()
        }
        content {
            includeModule("baritone.release", "baritone-api")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(":common")
    compileOnly "baritone.release:baritone-api:${project.baritone_api_version}"
    if (baritoneSmokeJar.isPresent()) {
        modRuntimeOnly files(baritoneSmokeJar.get())
    }
    if (baritoneSmokeSupportJar.isPresent()) {
        // Loom removes the nested-JAR declaration while remapping a local
        // production mod. Supply Baritone's already bundled support JAR only
        // for this development smoke path; normal users install one JAR.
        modRuntimeOnly files(baritoneSmokeSupportJar.get())
    }

    testImplementation "org.junit.jupiter:junit-jupiter:6.0.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.0.3"
}

processResources {
    inputs.property "version", expandedModVersion

    filesMatching("fabric.mod.json") {
        expand "version": expandedModVersion
    }
}

tasks.named("processGametestResources") {
    inputs.property "version", expandedModVersion

    filesMatching("fabric.mod.json") {
        expand "version": expandedModVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.add("-Xlint:deprecation")
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named("runClientGameTest") {
    // Auto Disconnect intentionally closes the underlying connection. Fabric's
    // deterministic packet synchronizer must be disabled for that scenario.
    jvmArgs "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
    if (baritoneSmokeJar.isPresent()) {
        jvmArgs "-Dsealed.e2e.expectBaritone=true"
    }
}

tasks.register("e2eTest") {
    group = "verification"
    description = "Runs the isolated Fabric client end-to-end test suite."
    dependsOn tasks.named("runClientGameTest")
}

tasks.register("qualityGate") {
    group = "verification"
    description = "Runs both platform builds, policy checks, and both client E2E suites."
    dependsOn tasks.named("check"), tasks.named("build"), tasks.named("runClientGameTest"),
            ":common:check", ":platform-26.2:check", ":platform-26.2:verifyRelease26",
            ":platform-26.2:runClientGameTest"
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def releaseDirectory = layout.buildDirectory.dir("release")
def releaseStagingDirectory = layout.buildDirectory.dir("generated/release")

tasks.register("generateSbom") {
    group = "distribution"
    description = "Generates a local CycloneDX-style dependency inventory."
    dependsOn tasks.named("remapJar")
    outputs.file(releaseStagingDirectory.map {
        it.file("sealed-client-${project.version}.sbom.json")
    })

    doLast {
        def components = configurations.runtimeClasspath.resolvedConfiguration
                .resolvedArtifacts
                .collect { artifact ->
                    def digest = MessageDigest.getInstance("SHA-256")
                    artifact.file.withInputStream { stream ->
                        byte[] buffer = new byte[8192]
                        int read
                        while ((read = stream.read(buffer)) >= 0) {
                            if (read > 0) {
                                digest.update(buffer, 0, read)
                            }
                        }
                    }
                    [
                            type   : "library",
                            group  : artifact.moduleVersion.id.group,
                            name   : artifact.name,
                            version: artifact.moduleVersion.id.version,
                            hashes : [[
                                    alg    : "SHA-256",
                                    content: digest.digest().encodeHex().toString()
                            ]]
                    ]
                }
                .sort { left, right ->
                    "${left.group}:${left.name}:${left.version}" <=>
                            "${right.group}:${right.name}:${right.version}"
                }

        def document = [
                bomFormat  : "CycloneDX",
                specVersion: "1.5",
                version    : 1,
                metadata   : [
                        component: [
                                type   : "application",
                                group  : project.group.toString(),
                                name   : project.archives_base_name,
                                version: project.version.toString()
                        ]
                ],
                components : components
        ]
        def output = outputs.files.singleFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(document)) + "\n"
    }
}

tasks.register("generateReleaseChecksums") {
    group = "distribution"
    description = "Writes SHA-256 checksums for release archives and the SBOM."
    dependsOn tasks.named("remapJar"), tasks.named("sourcesJar"), tasks.named("generateSbom")
    inputs.files("SECURITY.md", "NOTICE", "LICENSE")
    outputs.file(releaseStagingDirectory.map { it.file("SHA256SUMS") })

    doLast {
        def files = [
                tasks.named("remapJar").get().archiveFile.get().asFile,
                tasks.named("sourcesJar").get().archiveFile.get().asFile,
                tasks.named("generateSbom").get().outputs.files.singleFile,
                file("SECURITY.md"),
                file("NOTICE"),
                file("LICENSE")
        ]
        def lines = files.collect { file ->
            def digest = MessageDigest.getInstance("SHA-256")
            file.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    if (read > 0) {
                        digest.update(buffer, 0, read)
                    }
                }
            }
            "${digest.digest().encodeHex()}  ${file.name}"
        }
        def output = outputs.files.singleFile
        output.parentFile.mkdirs()
        output.text = lines.join("\n") + "\n"
    }
}

def releaseSigningKey = providers.environmentVariable("SEALED_RELEASE_SIGNING_KEY")
def releaseSigningPassword = providers.environmentVariable("SEALED_RELEASE_SIGNING_PASSWORD")
if (releaseSigningKey.isPresent()) {
    signing {
        useInMemoryPgpKeys(
                releaseSigningKey.get(),
                releaseSigningPassword.getOrElse("")
        )
    }
}

tasks.register("signRelease", Sign) {
    group = "distribution"
    description = "Creates detached signatures when SEALED_RELEASE_SIGNING_KEY is provided."
    dependsOn tasks.named("remapJar"), tasks.named("sourcesJar"),
            tasks.named("generateSbom"), tasks.named("generateReleaseChecksums")
    onlyIf { releaseSigningKey.isPresent() }
    sign tasks.named("remapJar").get()
    sign tasks.named("sourcesJar").get()
    sign tasks.named("generateSbom").get().outputs.files.singleFile
    sign tasks.named("generateReleaseChecksums").get().outputs.files.singleFile
}

tasks.register("releaseBundle", Sync) {
    group = "distribution"
    description = "Builds the auditable release bundle."
    dependsOn tasks.named("build"), tasks.named("generateReleaseChecksums")
    if (releaseSigningKey.isPresent()) {
        dependsOn tasks.named("signRelease")
    }
    into releaseDirectory
    from(tasks.named("remapJar").flatMap { it.archiveFile })
    from(tasks.named("sourcesJar").flatMap { it.archiveFile })
    from(tasks.named("generateSbom").map { it.outputs.files.singleFile })
    from(tasks.named("generateReleaseChecksums").map { it.outputs.files.singleFile })
    from("SECURITY.md")
    from("NOTICE")
    from("LICENSE")
    if (releaseSigningKey.isPresent()) {
        from(tasks.named("signRelease").map { it.signatureFiles })
    }
}

tasks.register("verifyReleaseBundle") {
    group = "verification"
    description = "Checks that release artifacts are non-empty and match SHA256SUMS."
    dependsOn tasks.named("releaseBundle")

    doLast {
        def directory = releaseDirectory.get().asFile
        def checksumFile = new File(directory, "SHA256SUMS")
        if (!checksumFile.isFile() || checksumFile.length() == 0L) {
            throw new GradleException("Release checksum manifest is missing or empty")
        }
        checksumFile.eachLine("UTF-8") { line ->
            def match = line =~ /^([0-9a-f]{64})  (.+)$/
            if (!match.matches()) {
                throw new GradleException("Malformed checksum line: ${line}")
            }
            def expected = match.group(1)
            def artifact = new File(directory, match.group(2))
            if (!artifact.isFile() || artifact.length() == 0L) {
                throw new GradleException("Release artifact is missing or empty: ${artifact.name}")
            }
            def digest = MessageDigest.getInstance("SHA-256")
            artifact.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    if (read > 0) {
                        digest.update(buffer, 0, read)
                    }
                }
            }
            def actual = digest.digest().encodeHex().toString()
            if (actual != expected) {
                throw new GradleException("Checksum mismatch for ${artifact.name}")
            }
        }
    }
}

def multiVersionReleaseDirectory = layout.buildDirectory.dir("multiversion-release")

tasks.register("multiVersionBuild") {
    group = "build"
    description = "Builds and tests the shared core plus the 1.21.4 and 26.2 adapters."
    dependsOn tasks.named("build"), ":common:build", ":platform-26.2:build"
}

tasks.register("stageMultiVersionRelease", Sync) {
    group = "distribution"
    description = "Stages both independently verified platform release bundles."
    dependsOn tasks.named("verifyReleaseBundle"), ":platform-26.2:verifyRelease26"
    into multiVersionReleaseDirectory
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(releaseDirectory) {
        rename { name -> name == "SHA256SUMS" ? "SHA256SUMS-mc1.21.4" : name }
    }
    from(project(":platform-26.2").layout.buildDirectory.dir("release26")) {
        rename { name -> name == "SHA256SUMS" ? "SHA256SUMS-mc26.2" : name }
    }

    doLast {
        File directory = multiVersionReleaseDirectory.get().asFile
        [
                "sealed-client-mc1.21.4-${project.version}.jar",
                "sealed-client-mc1.21.4-${project.version}-sources.jar",
                "sealed-client-mc26.2-${project.version}.jar",
                "sealed-client-mc26.2-${project.version}-sources.jar",
                "SHA256SUMS-mc1.21.4",
                "SHA256SUMS-mc26.2",
                "SECURITY.md",
                "NOTICE",
                "LICENSE"
        ].each { name ->
            File artifact = new File(directory, name)
            if (!artifact.isFile() || artifact.length() == 0L) {
                throw new GradleException("Missing staged multi-version artifact: ${name}")
            }
        }
        if (directory.listFiles({ file -> file.name.endsWith(".json") } as FileFilter)
                .count { file -> file.name.contains("sbom") || file.name.contains("-bom") } != 2) {
            throw new GradleException("The multi-version release must contain exactly two SBOMs")
        }
    }
}

tasks.register("generateMultiVersionChecksums") {
    group = "distribution"
    description = "Writes a deterministic checksum manifest for the combined release."
    dependsOn tasks.named("stageMultiVersionRelease")
    outputs.file(multiVersionReleaseDirectory.map { it.file("SHA256SUMS") })

    doLast {
        File directory = multiVersionReleaseDirectory.get().asFile
        File output = outputs.files.singleFile
        List<File> artifacts = directory.listFiles()
                .findAll { file -> file.isFile() && file != output }
                .sort { left, right -> left.name <=> right.name }
        if (artifacts.isEmpty()) {
            throw new GradleException("No artifacts were staged for the multi-version release")
        }
        List<String> lines = artifacts.collect { artifact ->
            MessageDigest digest = MessageDigest.getInstance("SHA-256")
            artifact.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    if (read > 0) {
                        digest.update(buffer, 0, read)
                    }
                }
            }
            "${digest.digest().encodeHex()}  ${artifact.name}"
        }
        output.text = lines.join("\n") + "\n"
    }
}

tasks.register("verifyMultiVersionRelease") {
    group = "verification"
    description = "Verifies every file in the combined 1.21.4 and 26.2 release bundle."
    dependsOn tasks.named("generateMultiVersionChecksums")

    doLast {
        File directory = multiVersionReleaseDirectory.get().asFile
        File manifest = new File(directory, "SHA256SUMS")
        if (!manifest.isFile() || manifest.length() == 0L) {
            throw new GradleException("Combined release checksum manifest is missing or empty")
        }
        Set<String> listed = new LinkedHashSet<>()
        manifest.eachLine("UTF-8") { line ->
            def match = line =~ /^([0-9a-f]{64})  (.+)$/
            if (!match.matches()) {
                throw new GradleException("Malformed combined checksum line: ${line}")
            }
            String name = match.group(2)
            if (!listed.add(name)) {
                throw new GradleException("Duplicate combined checksum entry: ${name}")
            }
            File artifact = new File(directory, name)
            if (!artifact.isFile() || artifact.length() == 0L) {
                throw new GradleException("Combined release artifact is missing: ${name}")
            }
            MessageDigest digest = MessageDigest.getInstance("SHA-256")
            artifact.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    if (read > 0) {
                        digest.update(buffer, 0, read)
                    }
                }
            }
            if (digest.digest().encodeHex().toString() != match.group(1)) {
                throw new GradleException("Combined checksum mismatch for ${name}")
            }
        }
        Set<String> actual = directory.listFiles()
                .findAll { file -> file.isFile() && file.name != "SHA256SUMS" }
                .collect { file -> file.name }
                .toSet()
        if (listed != actual) {
            throw new GradleException(
                    "Combined checksum coverage mismatch; missing=${actual - listed}, "
                            + "stale=${listed - actual}"
            )
        }
    }
}

tasks.register("multiVersionRelease") {
    group = "distribution"
    description = "Builds and verifies the combined 1.21.4 and 26.2 release bundle."
    dependsOn tasks.named("verifyMultiVersionRelease")
}

jar {
    from(project(":common").sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("NOTICE") {
        rename { "${it}_${noticeArchiveName}" }
    }
    from("LICENSE")
}

tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
